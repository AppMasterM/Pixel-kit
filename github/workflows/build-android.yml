
name: Build PixelKit Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract PixelKit source ZIP
        run: |
          test -f pixelkit-fixed.zip
          mkdir -p /tmp/pixelkit-source
          unzip -q pixelkit-fixed.zip -d /tmp/pixelkit-source
          test -f /tmp/pixelkit-source/pixelkit/package.json
          cp -a /tmp/pixelkit-source/pixelkit/. .
          echo "PixelKit source extracted successfully"

      - name: Verify project files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -d src
          test -d public

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#7B2CBF' --iconBackgroundColorDark '#7B2CBF'

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
