
name: PixelKit Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build PixelKit APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract PixelKit source
        run: |
          test -f pixelkit-fixed.zip
          mkdir -p /tmp/pixelkit-source
          unzip -q pixelkit-fixed.zip -d /tmp/pixelkit-source

          SOURCE_DIR="$(find /tmp/pixelkit-source -type f -name package.json -print -quit | xargs dirname)"
          test -f "$SOURCE_DIR/package.json"
          cp -a "$SOURCE_DIR/." .

      - name: Verify source files
        run: |
          test -f package.json
          test -d src
          test -d public
          cat package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Install Capacitor assets tool
        run: npm install --no-save @capacitor/assets

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload PixelKit APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelKit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
